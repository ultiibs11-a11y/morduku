<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MORDOKU – Fallakte</title>

<!-- iPhone / iPad App-Symbol -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<!-- Darstellung als Web-App auf iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MORDOKU">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:radial-gradient(circle at top,#252525 0%,#111 45%,#070707 100%);
color:#eee;
min-height:100vh
}

header{
background:#0b0b0b;
border-bottom:2px solid #b30000;
padding:22px;
text-align:center;
box-shadow:0 4px 20px rgba(180,0,0,.25)
}

.logo{
font-size:32px;
font-weight:900;
letter-spacing:5px;
color:#e00000;
text-shadow:0 0 12px rgba(220,0,0,.5)
}

.subtitle{
color:#888;
margin-top:6px;
font-size:13px;
letter-spacing:2px
}

main{
max-width:1000px;
margin:auto;
padding:25px 15px 50px
}

.dashboard{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
margin-bottom:25px
}

.stat{
background:#171717;
border:1px solid #333;
border-radius:10px;
padding:15px;
text-align:center
}

.stat-number{
font-size:27px;
font-weight:bold;
color:#e00000
}

.stat-label{
color:#888;
font-size:12px;
margin-top:4px
}

.search{
width:100%;
padding:14px;
margin-bottom:18px;
background:#111;
border:1px solid #444;
border-radius:8px;
color:white;
font-size:15px;
outline:none
}

.search:focus{
border-color:#b30000
}

.case{
background:linear-gradient(145deg,#1b1b1b,#111);
border:1px solid #333;
border-left:4px solid #800000;
border-radius:10px;
padding:18px;
margin-bottom:12px;
transition:.2s
}

.case:hover{
border-left-color:#e00000;
box-shadow:0 0 15px rgba(180,0,0,.15)
}

.case-header{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:12px
}

.case-number{
font-weight:bold;
color:#ddd;
font-size:17px
}

.status{
font-size:11px;
padding:5px 9px;
border-radius:20px;
background:#252525;
color:#777
}

.status.done{
background:#173517;
color:#55d455
}

.input-row{
display:flex;
gap:8px
}

input[type=text]{
flex:1;
padding:12px;
background:#090909;
color:white;
border:1px solid #444;
border-radius:7px;
outline:none
}

input[type=text]:focus{
border-color:#b30000
}

button{
border:none;
border-radius:7px;
padding:0 17px;
background:#a80000;
color:white;
font-weight:bold;
cursor:pointer;
transition:.2s
}

button:hover{
background:#d00000
}

.clear{
margin-top:10px;
background:transparent;
border:1px solid #444;
color:#888;
padding:7px 12px;
font-size:11px
}

.clear:hover{
background:#222;
color:#ddd
}

.footer{
text-align:center;
color:#555;
font-size:11px;
margin-top:30px
}

@media(max-width:600px){

.dashboard{
grid-template-columns:1fr 1fr 1fr
}

.logo{
font-size:25px
}

.input-row{
flex-direction:column
}

button{
padding:12px
}

}
</style>
</head>

<body>

<header>
<div class="logo">MORDOKU</div>
<div class="subtitle">POLIZEI · FALLAKTEN · INTERN</div>
</header>

<main>

<div class="dashboard">

<div class="stat">
<div class="stat-number" id="total">80</div>
<div class="stat-label">FÄLLE</div>
</div>

<div class="stat">
<div class="stat-number" id="solved">0</div>
<div class="stat-label">EINGETRAGEN</div>
</div>

<div class="stat">
<div class="stat-number" id="remaining">80</div>
<div class="stat-label">OFFEN</div>
</div>

</div>

<input
class="search"
id="search"
type="text"
placeholder="Fall suchen..."
oninput="filterCases()"
>

<div id="cases"></div>

<div class="footer">
MORDOKU · INTERNE ERMITTLUNGSDATEI
</div>

</main>

<script>

const TOTAL_CASES=80;

function loadData(){
return JSON.parse(
localStorage.getItem("mordokuCases")||"{}"
);
}

function saveData(data){
localStorage.setItem(
"mordokuCases",
JSON.stringify(data)
);
}

function createCases(){

const container=document.getElementById("cases");
const data=loadData();

container.innerHTML="";

for(let i=1;i<=TOTAL_CASES;i++){

const value=data[i]||"";
const el=document.createElement("div");

el.className="case";
el.dataset.number=i;

el.innerHTML=`

<div class="case-header">

<div class="case-number">
FALL #${String(i).padStart(2,"0")}
</div>

<div class="status ${value?"done":""}">
${value?"GEKLÄRT":"OFFEN"}
</div>

</div>

<div class="input-row">

<input
type="text"
id="case-${i}"
placeholder="Name des Mörders..."
value="${escapeHTML(value)}"
onchange="saveCase(${i})"
>

<button onclick="saveCase(${i})">
SPEICHERN
</button>

</div>

${
value
?
`<button class="clear" onclick="clearCase(${i})">
Eintrag löschen
</button>`
:
""
}

`;

container.appendChild(el);

}

updateStats();

}

function saveCase(number){

const input=document.getElementById(`case-${number}`);
const data=loadData();

data[number]=input.value.trim();

saveData(data);

createCases();

}

function clearCase(number){

const data=loadData();

delete data[number];

saveData(data);

createCases();

}

function updateStats(){

const data=loadData();

const solved=
Object.values(data)
.filter(v=>v&&v.trim()!=="")
.length;

document.getElementById("solved").textContent=solved;

document.getElementById("remaining").textContent=
TOTAL_CASES-solved;

}

function filterCases(){

const search=
document.getElementById("search")
.value
.toLowerCase();

document
.querySelectorAll(".case")
.forEach(el=>{

const number=el.dataset.number;

const murderer=
el.querySelector("input")
.value
.toLowerCase();

el.style.display=
(
number.includes(search) ||
murderer.includes(search)
)
?
""
:
"none";

});

}

function escapeHTML(text){

return text
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

createCases();

</script>

</body>
</html>
